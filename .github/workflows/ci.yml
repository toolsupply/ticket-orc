name: CI

on:
  push:
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/setup-ticket
      - name: test
        shell: bash
        # The full suite includes the native outer-boundary smoke and the
        # controlled handoff policy integration; no stale -run selectors.
        run: |
          set -o pipefail
          {
            git rev-parse HEAD
            go version
            go env GOOS GOARCH
            ticket --version
            go test -shuffle=on -count=1 ./...
          } 2>&1 | tee native-tests.log
      - name: retain native test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-tests-${{ matrix.os }}-${{ github.sha }}
          path: native-tests.log
          if-no-files-found: error
          retention-days: 7
      - name: vet
        run: go vet ./...

  race:
    name: race (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/setup-ticket
      - name: race test
        run: go test -race -count=1 ./...

  format:
    name: format and dependency check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: standard library dependency check
        shell: bash
        run: test "$(go list -m all | wc -l)" -eq 1

  cross-build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: cross-build
        shell: bash
        run: |
          test "${{ strategy.job-total }}" -eq 5
          version="$(tr -d '\r\n' < VERSION)"
          out=ticket-orc
          if [ "${{ matrix.goos }}" = windows ]; then out=ticket-orc.exe; fi
          CGO_ENABLED=0 GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}" \
            go build -trimpath \
            -ldflags "-s -w -X github.com/toolsupply/ticket-orc/internal/cli.Version=$version -X github.com/toolsupply/ticket-orc/internal/cli.Commit=$GITHUB_SHA" \
            -o "$out" ./cmd/ticket-orc

  build-info:
    name: CI version output
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: build and verify CI metadata
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          commit="$(git rev-parse HEAD)"
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X github.com/toolsupply/ticket-orc/internal/cli.Version=$version -X github.com/toolsupply/ticket-orc/internal/cli.Commit=$commit" \
            -o ticket-orc ./cmd/ticket-orc
          test "$(./ticket-orc --version)" = "ticket-orc $version ($commit)"
